openapi: 3.0.1
info:
  title: call-calendar
  description: "Booking calendar API: hosts publish availability, guests book call\
    \ slots."
  version: "0.1"
servers:
- url: /
tags:
- name: ping
  description: Connectivity check
- name: slots
  description: Browsing available slots
- name: booking
  description: Booking and cancelling slots
- name: booking-types
  description: Host-defined booking types the guest picks
- name: host-settings
  description: Public host settings
paths:
  /api/booking-types:
    get:
      tags:
      - booking-types
      summary: Active booking types for the guest picker
      operationId: listActiveBookingTypes
      responses:
        "200":
          description: "Active types, sorted for the picker (lowest sort_order first)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingTypeResponse"
  /api/bookings:
    get:
      tags:
      - booking
      summary: List upcoming bookings
      operationId: listBookings
      responses:
        "200":
          description: "Bookings with end_at > now, both states, sorted by start_at\
            \ ascending. The host UI splits the response into a 'Happening now' section\
            \ (start <= now < end) and the upcoming list (start > now)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostBookingResponse"
    post:
      tags:
      - booking
      summary: Book an available slot
      operationId: createBooking
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
        required: true
      responses:
        "201":
          description: Booking created; cancellationToken unlocks UC-4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: "Malformed body, missing bookingTypeId, or inactive booking\
            \ type"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "Slot no longer available (taken, past, too soon, or outside\
            \ availability)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/bookings/{token}:
    get:
      tags:
      - booking
      summary: Booking details by secret cancellation token
      operationId: getBooking
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: No booking for this token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/bookings/{token}/cancel:
    post:
      tags:
      - booking
      summary: Cancel a booking via its secret token
      operationId: cancelBooking
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The booking, now cancelled; the slot is free again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: No booking for this token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: The booking has started and can no longer be cancelled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/host-settings:
    get:
      tags:
      - host-settings
      summary: "Public host settings: timezone"
      operationId: getHostSettings
      responses:
        "200":
          description: Host settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSettingsResponse"
  /api/host/booking-types:
    get:
      tags:
      - booking-types
      summary: "All booking types (host view), including inactive and drafts"
      operationId: listAllBookingTypes
      responses:
        "200":
          description: "Every row, ordered for the host settings page"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingTypeResponse"
    post:
      tags:
      - booking-types
      summary: Create a booking type
      operationId: createBookingType
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingTypeRequest"
        required: true
      responses:
        "201":
          description: "The new type, with database-assigned id and sort_order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingTypeResponse"
        "400":
          description: "Missing or invalid fields (blank title, duration outside 5-240\
            \ minutes)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/host/booking-types/{id}:
    put:
      tags:
      - booking-types
      summary: Update a booking type
      operationId: updateBookingType
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingTypeRequest"
        required: true
      responses:
        "200":
          description: The updated type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingTypeResponse"
        "400":
          description: Missing or invalid fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No booking type with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - booking-types
      summary: Delete a booking type
      operationId: deleteBookingType
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Type deleted
        "404":
          description: No booking type with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/host/bookings/{id}/cancel:
    post:
      tags:
      - host-bookings
      summary: Cancel a booking by its numeric id (host view)
      operationId: cancelBookingById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: "The booking, now cancelled; the slot is free again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostBookingResponse"
        "404":
          description: No booking for this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: The booking has started and can no longer be cancelled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/ping:
    get:
      tags:
      - ping
      summary: Connectivity check used to prove frontend/backend wiring
      operationId: ping
      responses:
        "200":
          description: ping 200 response
          content:
            text/plain:
              schema:
                type: string
  /api/slots:
    get:
      tags:
      - slots
      summary: "Available slot start times for a host-local day, filtered by booking\
        \ type"
      operationId: getSlots
      parameters:
      - name: date
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: bookingTypeId
        in: query
        required: true
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Slot start times as UTC instants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
        "400":
          description: Malformed date or unknown / inactive bookingTypeId
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    BookingResponse:
      required:
      - bookingTypeId
      - cancellationToken
      - end
      - guestEmail
      - guestName
      - start
      - state
      type: object
      properties:
        guestName:
          type: string
        guestEmail:
          type: string
        start:
          type: string
        end:
          type: string
        state:
          type: string
        bookingTypeId:
          type: integer
          format: int64
        cancellationToken:
          type: string
      description: "Payload returned to guests (UC-3, UC-4) --- exposes the secret\
        \ cancellation token."
    BookingTypeResponse:
      required:
      - active
      - description
      - durationMinutes
      - id
      - sortOrder
      - title
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        active:
          type: boolean
      description: Public payload for a booking type --- used by both the guest list
        and host CRUD responses.
    CreateBookingRequest:
      required:
      - guestEmail
      - guestName
      - start
      type: object
      properties:
        start:
          type: string
        bookingTypeId:
          type: integer
          format: int64
          nullable: true
        guestName:
          type: string
        guestEmail:
          type: string
      description: "Body of POST /api/bookings. The guest picks a booking type and\
        \ the server derives `durationMinutes` from it (GLOSSARY.md: \"Booking type\"\
        ). Fields are nullable because input is untrusted."
    CreateBookingTypeRequest:
      required:
      - description
      - durationMinutes
      - title
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
      description: Body of POST /api/host/booking-types. Fields are nullable because
        input is untrusted.
    HostBookingResponse:
      required:
      - bookingTypeId
      - end
      - guestEmail
      - guestName
      - id
      - start
      - state
      type: object
      properties:
        id:
          type: integer
          format: int64
        guestName:
          type: string
        guestEmail:
          type: string
        start:
          type: string
        end:
          type: string
        state:
          type: string
        bookingTypeId:
          type: integer
          format: int64
      description: "Bookings payload the host page needs. Mirrors BookingResponse\
        \ minus the secret cancellation token: the token is meant to be per-guest\
        \ (docs/domain.md), and listing every guest's token in one unauthenticated\
        \ response would contradict that. The id is included so the host view can\
        \ drive host-side cancellation by id (UC-6). `bookingTypeId` lets the host\
        \ page render the booking type of each row (which one the guest chose)."
    HostSettingsResponse:
      required:
      - timezone
      type: object
      properties:
        timezone:
          type: string
      description: "Public host settings the guest UI needs: timezone. Allowed durations\
        \ now live in booking_type."
    ProblemDetail:
      required:
      - detail
      - status
      - title
      - type
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
      description: RFC 7807 problem detail; served as application/problem+json.
    UpdateBookingTypeRequest:
      required:
      - active
      - description
      - durationMinutes
      - sortOrder
      - title
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        active:
          type: boolean
      description: "Body of PUT /api/host/booking-types/{id}. `sortOrder` and `active`\
        \ are host-only bookkeeping fields, so the host can move the type to the top\
        \ of the picker or hide it without creating / deleting."
