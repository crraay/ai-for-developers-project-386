openapi: 3.0.0
info:
  title: call-calendar
  version: '0.1'
  description: 'Booking calendar API: hosts publish availability, guests book call slots.'
tags:
  - name: ping
    description: Connectivity check
  - name: slots
    description: Browsing available slots
  - name: booking
    description: Booking and cancelling slots
  - name: booking-types
    description: Host-defined booking types the guest picks
  - name: host-bookings
    description: Host-only booking operations
  - name: host-settings
    description: Public host settings
paths:
  /api/booking-types:
    get:
      operationId: listActiveBookingTypes
      summary: Active booking types for the guest picker
      parameters: []
      responses:
        '200':
          description: Active types, sorted for the picker (lowest sort_order first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingTypeResponse'
      tags:
        - booking-types
  /api/bookings:
    get:
      operationId: listBookings
      summary: List upcoming bookings
      parameters: []
      responses:
        '200':
          description: Bookings with end_at > now, both states, sorted by start_at ascending. The host UI splits the response into a 'Happening now' section (start <= now < end) and the upcoming list (start > now).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostBookingResponse'
      tags:
        - booking
    post:
      operationId: createBooking
      summary: Book an available slot
      parameters: []
      responses:
        '201':
          description: Booking created; cancellationToken unlocks UC-4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Malformed body, missing bookingTypeId, or inactive booking type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Slot no longer available (taken, past, too soon, or outside availability)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
  /api/bookings/{token}:
    get:
      operationId: getBooking
      summary: Booking details by secret cancellation token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: No booking for this token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - booking
  /api/bookings/{token}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel a booking via its secret token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The booking, now cancelled; the slot is free again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: No booking for this token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The booking has started and can no longer be cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - booking
  /api/host-settings:
    get:
      operationId: getHostSettings
      summary: 'Public host settings: timezone and inclusive booking window'
      parameters: []
      responses:
        '200':
          description: Host settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostSettingsResponse'
      tags:
        - host-settings
  /api/host/booking-types:
    get:
      operationId: listAllBookingTypes
      summary: All booking types (host view), including inactive and drafts
      parameters: []
      responses:
        '200':
          description: Every row, ordered for the host settings page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingTypeResponse'
      tags:
        - booking-types
    post:
      operationId: createBookingType
      summary: Create a booking type
      parameters: []
      responses:
        '201':
          description: The new type, with database-assigned id and sort_order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTypeResponse'
        '400':
          description: Missing or invalid fields (blank title, duration outside 5-240 minutes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - booking-types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingTypeRequest'
  /api/host/booking-types/{id}:
    put:
      operationId: updateBookingType
      summary: Update a booking type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The updated type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTypeResponse'
        '400':
          description: Missing or invalid fields (blank title, duration outside 5-240 minutes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No booking type with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - booking-types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingTypeRequest'
    delete:
      operationId: deleteBookingType
      summary: Delete a booking type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Type deleted
        '404':
          description: No booking type with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - booking-types
  /api/host/bookings/{id}/cancel:
    post:
      operationId: cancelBookingById
      summary: Cancel a booking by its numeric id (host view)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The booking, now cancelled; the slot is free again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostBookingResponse'
        '404':
          description: No booking for this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The booking has started and can no longer be cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - host-bookings
  /api/ping:
    get:
      operationId: ping
      summary: Connectivity check used to prove frontend/backend wiring
      parameters: []
      responses:
        '200':
          description: ping 200 response
          content:
            text/plain:
              schema:
                type: string
      tags:
        - ping
  /api/slots:
    get:
      operationId: getSlots
      summary: Available slot start times for a host-local day, filtered by booking type
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: bookingTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          explode: false
      responses:
        '200':
          description: Slot start times as UTC instants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Malformed date or unknown / inactive bookingTypeId
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      tags:
        - slots
components:
  schemas:
    BookingResponse:
      type: object
      required:
        - guestName
        - guestEmail
        - start
        - end
        - state
        - bookingTypeId
        - cancellationToken
      properties:
        guestName:
          type: string
        guestEmail:
          type: string
        start:
          type: string
        end:
          type: string
        state:
          type: string
        bookingTypeId:
          type: integer
          format: int64
        cancellationToken:
          type: string
      description: Payload returned to guests (UC-3, UC-4) — exposes the secret cancellation token.
    BookingTypeResponse:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
        - sortOrder
        - active
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        active:
          type: boolean
      description: Public payload for a booking type — used by both the guest list and host CRUD responses.
    CreateBookingRequest:
      type: object
      required:
        - start
        - guestName
        - guestEmail
      properties:
        start:
          type: string
        bookingTypeId:
          type: integer
          format: int64
          nullable: true
        guestName:
          type: string
        guestEmail:
          type: string
      description: 'Body of POST /api/bookings. The guest picks a booking type and the server derives `durationMinutes` from it (GLOSSARY.md: "Booking type"). Fields are nullable because input is untrusted.'
    CreateBookingTypeRequest:
      type: object
      required:
        - title
        - description
        - durationMinutes
      properties:
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
      description: Body of POST /api/host/booking-types. Fields are nullable because input is untrusted.
    HostBookingResponse:
      type: object
      required:
        - id
        - guestName
        - guestEmail
        - start
        - end
        - state
        - bookingTypeId
      properties:
        id:
          type: integer
          format: int64
        guestName:
          type: string
        guestEmail:
          type: string
        start:
          type: string
        end:
          type: string
        state:
          type: string
        bookingTypeId:
          type: integer
          format: int64
      description: "Bookings payload the host page needs. Mirrors BookingResponse minus the secret cancellation token: the token is meant to be per-guest (docs/domain.md), and listing every guest's token in one unauthenticated response would contradict that. The id is included so the host view can drive host-side cancellation by id (UC-6). `bookingTypeId` lets the host page render the booking type of each row (which one the guest chose)."
    HostSettingsResponse:
      type: object
      required:
        - timezone
        - bookingHorizonDays
      properties:
        timezone:
          type: string
          description: "IANA timezone the host's availability is defined in (seeded: Europe/Berlin)."
        bookingHorizonDays:
          type: integer
          format: int32
          description: 'Number of calendar days the guest may book ahead, including today (seeded: 14).'
      description: 'Public host settings the guest UI needs: the host timezone and the inclusive booking window. The window opens on the current host-local day and `bookingHorizonDays` includes today (14 means the last bookable date is today + 13). Seeded availability is Mon-Fri 09:00-17:00 host-local (`Europe/Berlin`); allowed durations live in booking_type.'
    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
      description: RFC 7807 problem detail; served as application/problem+json.
    UpdateBookingTypeRequest:
      type: object
      required:
        - title
        - description
        - durationMinutes
        - sortOrder
        - active
      properties:
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        active:
          type: boolean
      description: Body of PUT /api/host/booking-types/{id}. `sortOrder` and `active` are host-only bookkeeping fields, so the host can move the type to the top of the picker or hide it without creating / deleting.
servers:
  - url: /
    description: Default server
    variables: {}
