name: security

on:
  schedule:
    - cron: "24 5 * * 1" # Mondays 05:24 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      # Scheduled (not on push) on purpose: a new advisory must not break
      # unrelated pushes. Expiring suppressions live in osv-scanner.toml.
      # Known gap: backend Gradle deps are not scanned (no gradle lockfile).
      - name: Scan lockfiles for known vulnerabilities
        run: osv-scanner scan source --recursive --config osv-scanner.toml .
