<section class="page">
  <h2>Pick a time</h2>
  <p class="hint">Times shown in {{ timeZone }}.</p>

  <div class="controls">
    <label class="field">
      <span class="field-label">Day</span>
      <input
        type="date"
        [value]="date()"
        [min]="minDate"
        [max]="maxDate"
        (change)="onDateChange($event)"
      />
    </label>
    <label class="field">
      <span class="field-label">Meeting type</span>
      <select [value]="typeId()" (change)="onTypeChange($event)">
        @for (option of types(); track option.id) {
          <option [value]="option.id">{{ option.title }} ({{ option.durationMinutes }} min)</option>
        }
      </select>
    </label>
  </div>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  @if (slots().length > 0) {
    <ul class="slots">
      @for (slot of slots(); track slot) {
        <li>
          <a
            class="slot-link"
            [routerLink]="['/book', slot]"
            [queryParams]="{ meetingTypeId: typeId() }"
          >
            {{ formatTime(slot) }}
          </a>
        </li>
      }
    </ul>
  } @else if (!error()) {
    <p class="hint">No available slots on this day.</p>
  }
</section>
