distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
# Cold-build lee-way: services.gradle.org has been observed to take >10s from
# the GH-hosted runner region (incident: smoke pipeline 42478130876 on
# 2026-11-08 timed out at the previous 10000ms/0retries). The Dockerfile
# mounts /root/.gradle as a cache so warm runs don't hit the network at all;
# these widened limits only matter for the first cold run that seeds GHA cache.
networkTimeout=60000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
