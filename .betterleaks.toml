title = "call-calendar"

[extend]
useDefault = true

# Hygiene: build outputs, dependencies, generated files and lockfiles are not scanned.
[[allowlists]]
description = "Non-source paths"
paths = [
  '''backend/build/''',
  # gitignored Gradle cache; its lock files are held mid-build on Windows, so
  # scanning them races check:backend
  '''backend/\.gradle/''',
  '''frontend/dist/''',
  '''node_modules/''',
  # generated and committed; changes only ever come from the generators
  '''frontend/src/api/''',
  '''openapi/api\.yml''',
  # lockfiles
  '''package-lock\.json''',
  '''mise\.lock''',
]

# The deploy setup keeps the Render API key in two gitignored local files
# (.env for scripts, .render-api-key for OpenCode's {file:} MCP header).
# Neither can ever be committed (.gitignore), CI never sees them, and the
# scanner's job for these paths is done by git itself. Scoped to the one rule
# that fires on Render keys so a real key anywhere else still fails.
# (review 2027-02-01)
[[allowlists]]
description = "Local Render API key files (gitignored, never committed)"
rules = ["render-api-key"]
paths = ['''^\.env$''', '''^\.render-api-key$''']

# The compose stack uses well-known dev-only credentials for the local PostgreSQL
# container; never used outside local dev. Scoped to secret="postgres" in
# docker-compose.yml only, so a real secret in that file still fails the scan.
# (review 2027-02-01)
[[allowlists]]
description = "Dev-only compose credentials"
regexTarget = "secret"
regexes = ['''^postgres$''']
paths = ['''docker-compose\.yml''']
