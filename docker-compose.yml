services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callcalendar
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d callcalendar"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    # CI builds with `docker/build-push-action` and tags the result
    # `backend:smoke`. Pinning the image here makes `docker compose up -d`
    # (no `--build`) reuse that local tag instead of building un-cached.
    image: backend:smoke
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://db:5432/callcalendar
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        MODE: development
    image: frontend:smoke
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
